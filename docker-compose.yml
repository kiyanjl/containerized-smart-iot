services:
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: mqtt-broker
    restart: unless-stopped
    ports:
      - "${MQTT_HOST_PORT:-1883}:1883"
      - "${MQTT_WS_HOST_PORT:-19001}:9001"
    volumes:
      - ./mqtt-broker/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mqtt-data:/mosquitto/data
    networks:
      - iot-network

  catalog-service:
    build: ./catalog-service
    container_name: catalog-service
    restart: unless-stopped
    ports:
      - "${CATALOG_HOST_PORT:-18080}:8080"
    volumes:
      - ./catalog-service/catalog.json:/app/catalog.json
    depends_on:
      mqtt-broker:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - iot-network

  sensor-simulator:
    build: ./sensor-simulator
    container_name: sensor-simulator
    restart: unless-stopped
    depends_on:
      mqtt-broker:
        condition: service_started
      catalog-service:
        condition: service_healthy
    networks:
      - iot-network

  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    ports:
      - "${INFLUXDB_HOST_PORT:-18086}:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin123
      DOCKER_INFLUXDB_INIT_ORG: smart-iot
      DOCKER_INFLUXDB_INIT_BUCKET: warehouse_metrics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: NnVSDg3Jxb8K1hpRyu8eMNCXf6Uix-T04fEti98mgN15sIjqn-qEWY8o72MLJwvVEZG1qG7ZD4cOlzL60Zyacg==
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://127.0.0.1:8086"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s
    networks:
      - iot-network

  controller-service:
    build: ./controller-service
    container_name: controller-service
    restart: unless-stopped
    ports:
      - "${CONTROLLER_HOST_PORT:-18001}:8001"
    environment:
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: NnVSDg3Jxb8K1hpRyu8eMNCXf6Uix-T04fEti98mgN15sIjqn-qEWY8o72MLJwvVEZG1qG7ZD4cOlzL60Zyacg==
      INFLUX_ORG: smart-iot
      INFLUX_BUCKET: warehouse_metrics
    depends_on:
      mqtt-broker:
        condition: service_started
      influxdb:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - iot-network

  actuator-service:
    build: ./actuator-service
    container_name: actuator-service
    restart: unless-stopped
    depends_on:
      mqtt-broker:
        condition: service_started
    networks:
      - iot-network

  alert-service:
    build:
      context: .
      dockerfile: alert-service/Dockerfile
    container_name: alert-service
    restart: unless-stopped
    ports:
      - "${ALERT_HOST_PORT:-15002}:5002"
    environment:
      MQTT_BROKER: mqtt-broker
      MQTT_PORT: 1883
      CATALOG_URL: http://catalog-service:8080
      CONTROLLER_URL: http://controller-service:8001
      ALERT_DATA_DIR: /app/data
      ALERT_PORT: 5002
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_API_BASE: https://api.telegram.org/bot
      ALERT_RATE_LIMIT: ${ALERT_RATE_LIMIT:-30}
    volumes:
      - ./alert-service/data:/app/data
    depends_on:
      mqtt-broker:
        condition: service_started
      catalog-service:
        condition: service_healthy
      controller-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5002/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - iot-network

  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3100}:3000"
    environment:
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/provisioning/dashboards:/var/lib/grafana/dashboards
      - grafana-storage:/var/lib/grafana
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 20s
    networks:
      - iot-network

  dashboard:
    build: ./dashboard
    container_name: dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-18501}:8501"
    environment:
      CATALOG_URL: http://catalog-service:8080
      CONTROLLER_URL: http://controller-service:8001
      ALERT_URL: http://alert-service:5002
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: NnVSDg3Jxb8K1hpRyu8eMNCXf6Uix-T04fEti98mgN15sIjqn-qEWY8o72MLJwvVEZG1qG7ZD4cOlzL60Zyacg==
      INFLUX_ORG: smart-iot
      INFLUX_BUCKET: warehouse_metrics
      GRAFANA_PUBLIC_URL: http://localhost:${GRAFANA_PORT:-3100}
      INFLUX_PUBLIC_URL: http://localhost:${INFLUXDB_HOST_PORT:-18086}
    depends_on:
      controller-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      grafana:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 25s
    networks:
      - iot-network

networks:
  iot-network:

volumes:
  influxdb-data:
  mqtt-data:
  grafana-storage:
